<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERRONACHT</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#cfd8e3;font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}main{max-width:32rem;text-align:center}h1{letter-spacing:.2em;font-weight:600;color:#e8eef5}p{color:#8a98a8}</style>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
if(window.caches){caches.keys().then(k=>k.forEach(n=>caches.delete(n)));}
</script></head>
<body><main><h1>FERRONACHT</h1>
<p id="t">La versión web ya no está disponible.</p></main>
<script>var l=(navigator.language||'es').slice(0,2);var m={en:'The web version is no longer available.',de:'Die Webversion ist nicht mehr verfügbar.'};if(m[l])document.getElementById('t').textContent=m[l];</script>
</body></html>
