<script>
/* FERRONACHT web (pruebas): el motor y el paquete se publican comprimidos (.gz) para caber en
   alojamientos con límite por archivo; se descomprimen en el navegador (Safari 16.4+). Si no hay
   DecompressionStream o falta el .gz, se pide el archivo sin comprimir. */
(function () {
	var nativeFetch = window.fetch.bind(window);
	var types = { 'index.wasm': 'application/wasm', 'index.pck': 'application/octet-stream' };
	window.fetch = function (input, init) {
		var url = (typeof input === 'string') ? input : ((input && input.url) || '');
		var name = url.split('?')[0].split('/').pop();
		if (!types[name] || typeof DecompressionStream === 'undefined') {
			return nativeFetch(input, init);
		}
		// Copia comprimida: «.gz» (GitHub Pages) o «.gz.wasm» (alojamientos que solo sirven tipos web).
		var tryGz = function (suffixes) {
			if (!suffixes.length) { return nativeFetch(input, init); }
			return nativeFetch(url.replace(name, name + suffixes[0]), init).then(function (r) {
				var ct = r.headers.get('Content-Type') || '';
				if (!r.ok || !r.body || ct.indexOf('text/html') >= 0) { return tryGz(suffixes.slice(1)); }
				var body = r.body.pipeThrough(new DecompressionStream('gzip'));
				return new Response(body, { status: 200, headers: { 'Content-Type': types[name] } });
			}).catch(function () { return tryGz(suffixes.slice(1)); });
		};
		return tryGz(['.gz', '.gz.wasm']);
	};
})();

<script>
(function () {
	var N = 12;   // cantones del esquema
	function build() {
		var d = document.createElement('div');
		d.id = 'fn-loader';
		var blocks = '';
		for (var i = 0; i < N; i++) {
			var x = 60 + i * 65;
			blocks += '<rect class="fn-blk" id="fn-b' + i + '" x="' + x + '" y="56" width="58" height="8" rx="2"/>';
			if (i > 0) { blocks += '<rect x="' + (x - 5) + '" y="50" width="2" height="20" fill="#1c2a31"/>'; }
		}
		d.innerHTML = '<h1>FERRONACHT</h1><div class="fn-sub">CONTROL DE TRÁFICO FERROVIARIO</div>' +
			'<svg viewBox="0 0 900 120" aria-hidden="true">' +
			'<text x="20" y="30" fill="#8fa9b3" font-size="14" font-family="monospace">ACCESO OESTE</text>' +
			'<text x="880" y="30" fill="#8fa9b3" font-size="14" font-family="monospace" text-anchor="end">FERRONACHT CENTRAL</text>' +
			'<rect x="20" y="58" width="860" height="4" fill="#1c2a31"/>' + blocks +
			'<g><rect x="34" y="78" width="3" height="22" fill="#55656c"/><circle class="fn-lamp" id="fn-s0" cx="35.5" cy="76" r="6" fill="#3be37a"/></g>' +
			'<g><rect x="866" y="78" width="3" height="22" fill="#55656c"/><circle class="fn-lamp fn-blink" id="fn-s1" cx="867.5" cy="76" r="6" fill="#ff4d4d"/></g>' +
			'<g id="fn-train" style="transition: transform .45s cubic-bezier(.3,.7,.4,1)" transform="translate(60,0)">' +
			'<rect x="-6" y="38" width="64" height="16" rx="3" fill="#0b1c22" stroke="#33d9f2" stroke-width="1.5"/>' +
			'<text x="26" y="50" fill="#33d9f2" font-size="11" font-family="monospace" text-anchor="middle">FN 001</text>' +
			'<polygon points="58,40 64,46 58,52" fill="#33d9f2"/></g></svg>' +
			'<div class="fn-msg"><span id="fn-txt">Conectando…</span> <span class="fn-pct" id="fn-pct"></span></div>';
		document.body.appendChild(d);
		var shown = -1, t0 = Date.now();
		var timer = setInterval(function () {
			var st = document.getElementById('status');
			var pr = document.getElementById('status-progress');
			if (!st) {   // el motor ha arrancado
				for (var k = 0; k < N; k++) { document.getElementById('fn-b' + k).classList.add('on'); }
				var s1 = document.getElementById('fn-s1'); s1.setAttribute('fill', '#3be37a'); s1.classList.remove('fn-blink');
				document.getElementById('fn-train').setAttribute('transform', 'translate(840,0)');
				document.getElementById('fn-txt').textContent = 'Turno listo';
				document.getElementById('fn-pct').textContent = '';
				clearInterval(timer);
				setTimeout(function () { d.classList.add('fn-done'); setTimeout(function () { d.remove(); }, 700); }, 450);
				return;
			}
			var notice = document.getElementById('status-notice');
			if (notice && notice.style.display === 'block') {   // error del motor: que se vea el aviso
				d.style.opacity = '0.25';
				return;
			}
			var f = 0, known = pr && pr.hasAttribute('value') && pr.max > 0;
			if (known) { f = Math.min(1, pr.value / pr.max); }
			var txt = document.getElementById('fn-txt'), pct = document.getElementById('fn-pct');
			if (known && f < 1) {
				txt.textContent = 'Descargando el juego…';
				pct.textContent = Math.floor(f * 100) + ' %';
			} else if (known) {
				txt.textContent = 'Preparando el motor…';
				pct.textContent = '';
				// mientras se compila, el tren avanza despacio por el último tramo
				f = 0.9 + 0.1 * (1 - Math.exp(-(Date.now() - t0) / 20000));
			} else {
				txt.textContent = 'Conectando…';
			}
			var lit = Math.floor(f * N);
			if (lit !== shown) {
				for (var j = 0; j < N; j++) { document.getElementById('fn-b' + j).classList.toggle('on', j < lit); }
				shown = lit;
			}
			document.getElementById('fn-train').setAttribute('transform', 'translate(' + (60 + f * 780).toFixed(1) + ',0)');
		}, 120);
	}
	if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', build); } else { build(); }
})();
</script>
